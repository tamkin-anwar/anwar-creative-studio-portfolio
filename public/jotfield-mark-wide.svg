<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="paper" cx="50%" cy="44%" r="70%"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f1e8dc"/></radialGradient>
    <radialGradient id="glow"><stop stop-color="#ff7043" stop-opacity=".2"/><stop offset=".55" stop-color="#ff7043" stop-opacity=".07"/><stop offset="1" stop-color="#ff7043" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#463222" flood-opacity=".2"/></filter>
    <path id="lozenge" d="M7.5 0H13.2A1.8 3 0 0 1 15 3V12.5A7.5 12.5 0 0 1 7.5 25H1.8A1.8 3 0 0 1 0 22V12.5A7.5 12.5 0 0 1 7.5 0Z"/>
  </defs>
  <style>
    .blue,.orange,.lime{transform-box:view-box;transform-origin:center;animation-duration:4.7s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}
    .blue{animation-name:blue}.orange{animation-name:orange}.lime{animation-name:lime}
    @keyframes blue{0%,100%{transform:translate(-7px,6px)}35%{transform:translate(-10px,8px)}68%{transform:translate(-6px,5px)}}
    @keyframes orange{0%,100%{transform:translate(0,0)}45%{transform:translate(1px,-1px)}72%{transform:translate(-1px,1px)}}
    @keyframes lime{0%,100%{transform:translate(8px,-5px)}32%{transform:translate(11px,-7px)}66%{transform:translate(7px,-4px)}}
    .halo{animation:halo 4.7s ease-in-out infinite;transform-origin:center}@keyframes halo{0%,100%{opacity:.28;transform:scale(.92)}50%{opacity:.52;transform:scale(1.08)}}
    @media(prefers-reduced-motion:reduce){.blue,.orange,.lime,.halo{animation:none}.blue{transform:translate(-7px,6px)}.lime{transform:translate(8px,-5px)}}
  </style>
  <rect width="1200" height="675" rx="24" fill="url(#paper)"/>
  <circle class="halo" cx="600" cy="322" r="250" fill="url(#glow)"/>
  <g transform="translate(600 320) scale(8.2) rotate(42) translate(-7.5 -12.5)" filter="url(#shadow)">
    <g class="lime"><use href="#lozenge" fill="#c9f06a"/></g>
    <g class="blue"><use href="#lozenge" fill="#315cf5"/></g>
    <g class="orange"><use href="#lozenge" fill="#ff5c35"/></g>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#695162">JOTFIELD</text>
</svg>
