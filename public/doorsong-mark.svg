<stop offset="0%" stop-color="#e2a05a" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#e2a05a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="sphere" cx="40%" cy="35%" r="70%">
<stop offset="0%" stop-color="#fff3d9"/>
<stop offset="18%" stop-color="#f0b56c"/>
<stop offset="42%" stop-color="#c96a3e"/>
<stop offset="70%" stop-color="#7a2a2a"/>
<stop offset="100%" stop-color="#170a0c"/>
</radialGradient>
</defs>
<rect x="0" y="0" width="680" height="680" fill="#0a0a0d"/>
<circle cx="340" cy="340" r="330" fill="url(#glow)"/>
<circle cx="340" cy="340" r="255" fill="none" stroke="#e2a05a" stroke-opacity="0.10" stroke-width="1"/>
<circle cx="340" cy="340" r="290" fill="none" stroke="#e2a05a" stroke-opacity="0.06" stroke-width="1"/>
<circle cx="340" cy="340" r="215" fill="url(#sphere)"/>
<path d="M 195 258 Q 340 210 485 258" fill="none" stroke="#0a0a0d" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
<line x1="222" y1="272" x2="222" y2="300" stroke="#0a0a0d" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>
<line x1="458" y1="272" x2="458" y2="300" stroke="#0a0a0d" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>
