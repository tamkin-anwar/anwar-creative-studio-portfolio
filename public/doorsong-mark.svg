<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img">
<title>Doorsong</title>
<desc>A glowing sphere fading from warm bronze at its highlight to deep red at its rim, with a thin lintel arc suggesting a doorway.</desc>
<defs>
